<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="600" height="740" viewBox="0 0 600 740">

  <!-- Background -->
  <rect width="600" height="740" fill="#1C1917"/>

  <!-- Outer gold border -->
  <rect x="18" y="18" width="564" height="704"
        fill="none" stroke="#B8923A" stroke-width="1.2"/>

  <!-- Corner accents -->
  <polyline points="18,50 18,18 50,18"   fill="none" stroke="#B8923A" stroke-width="2.5"/>
  <polyline points="550,18 582,18 582,50" fill="none" stroke="#B8923A" stroke-width="2.5"/>
  <polyline points="18,690 18,722 50,722" fill="none" stroke="#B8923A" stroke-width="2.5"/>
  <polyline points="550,722 582,722 582,690" fill="none" stroke="#B8923A" stroke-width="2.5"/>

  <!-- Name -->
  <text x="300" y="92"
        text-anchor="middle"
        font-family="Impact, Arial Narrow, sans-serif"
        font-size="42" fill="#B8923A" letter-spacing="6">CLAUDE MAKÉLÉLÉ</text>

  <!-- Gold divider -->
  <line x1="80" y1="112" x2="520" y2="112"
        stroke="#B8923A" stroke-width="0.6" opacity="0.5"/>

  <!-- Tagline -->
  <text x="300" y="140"
        text-anchor="middle"
        font-family="Georgia, serif" font-size="14"
        font-style="italic" fill="#6B6560" letter-spacing="2">Site Officiel</text>

  <!-- White QR background (with subtle shadow simulation via layered rects) -->
  <rect x="106" y="166" width="388" height="388"
        fill="#2a2520" rx="8"/>
  <rect x="110" y="170" width="380" height="380"
        fill="#ffffff" rx="6"/>

  <!-- QR Code -->
  <image href="data:image/png;base64,"
         x="120" y="180" width="360" height="360"/>

  <!-- Gold divider -->
  <line x1="80" y1="570" x2="520" y2="570"
        stroke="#B8923A" stroke-width="0.6" opacity="0.5"/>

  <!-- Scan label -->
  <text x="300" y="602"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="10"
        fill="#B8923A" letter-spacing="5">SCANNEZ POUR VISITER</text>

  <!-- URL -->
  <text x="300" y="630"
        text-anchor="middle"
        font-family="Georgia, serif" font-size="14"
        font-style="italic" fill="#6B6560">claudemakélélé.com</text>

  <!-- Bottom dot trio -->
  <circle cx="278" cy="704" r="2.5" fill="#B8923A" opacity="0.45"/>
  <circle cx="300"    cy="704" r="3.5" fill="#B8923A"/>
  <circle cx="322" cy="704" r="2.5" fill="#B8923A" opacity="0.45"/>

</svg>